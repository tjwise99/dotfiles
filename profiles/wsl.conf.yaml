# WSL-only links.
#
# ~/.aws and ~/.azure are deliberately absent: they are symlinks into the
# Windows user profile, so they are neither tracked nor deployed.
#
# This file is nearly empty by design. Everything the WSL box needs lives in
# base.conf.yaml, because the only thing it genuinely lacks is X — and nothing
# in base needs it. A line arriving here should have to argue that it does.
#
# bash/bashrc is still deployed: zsh is the login shell on both hosts, but an
# inbound non-interactive bash and Windows-side `wsl -e bash -lc` still read it,
# and it is what sources shell/common.sh for them.
- defaults:
    link:
      relink: true
      force: true
      create: true

- link:
    ~/.bashrc: bash/bashrc
