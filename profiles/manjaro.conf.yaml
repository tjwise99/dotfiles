# Manjaro-only. The desktop links this host used to carry moved to
# desktop.conf.yaml, which install applies to every graphical host — what is
# left here is the part that is true of Manjaro and not of NixOS.
#
# Only this host has a radio and a wired port that Manjaro itself does not
# configure, so the network stack is here rather than in base. Not a link block:
# these targets are under /etc, and system/apply.sh says why that makes them
# copies. On NixOS the same configuration is declared in the system config
# instead, which is why nixos.conf.yaml has no equivalent step.
- shell:
    - command: ./system/apply.sh
      description: Apply the root-owned network configuration
      stdout: true
      stderr: true
