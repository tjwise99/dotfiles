# Deployed on every host. A config belongs here unless it needs an X server.
- defaults:
    link:
      relink: true
      force: true
      create: true

- clean: ["~", "~/.claude"]

- link:
    # Shell. lightdm's Xsession sources ~/.profile before starting the graphical
    # session, so on the laptop it is the only file that can put a directory on
    # the session PATH, independently of which shell that host logs in with.
    ~/.profile: shell/profile

    # zsh is the only login shell, and zsh/zshrc sources its plugins from this
    # repo rather than /usr/share, so it is host-independent. What is
    # laptop-specific went to zsh/zshrc.x, which only manjaro.conf.yaml deploys.
    #
    # ~/.zshenv carries the environment because it is the only one of these zsh
    # reads for a non-interactive shell — `ssh host <command>` and a zsh script
    # never open ~/.zshrc, and without it they run with no asdf shims on PATH.
    ~/.zshenv: zsh/zshenv
    ~/.zshrc: zsh/zshrc
    ~/.p10k.zsh: zsh/p10k.zsh

    # Git. git reads the ignore file from this path on its own — gitconfig sets
    # no core.excludesFile, so moving it would need a setting to follow.
    ~/.gitconfig: git/gitconfig
    ~/.config/git/ignore: git/ignore
    ~/.config/git/hooks/pre-commit: git/hooks/pre-commit

    # Claude Code — individual children only. ~/.claude also holds
    # projects/, history.jsonl and caches, which must not be tracked.
    ~/.claude/CLAUDE.md: claude/CLAUDE.md
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/agents: claude/agents
    ~/.claude/skills: claude/skills
    ~/.claude/commands: claude/commands

    # gh CLI — config.yml only. hosts.yml sits beside it holding the account
    # and token, and stays unmanaged for the same reason ~/.claude is linked
    # child by child rather than wholesale.
    #
    # `gh config set` rewrites the file in place through the symlink. It keeps
    # comments attached to a key but discards anything above the first one, so
    # notes about this file belong here or in the README, not in its header.
    ~/.config/gh/config.yml: gh/config.yml

    # gh-dash is a TUI over the API, so it belongs here rather than with the
    # desktop configs, same as ranger and htop. Its sections lean on the local
    # patch (is:blocked, milestone ordering), so config and patch have to travel
    # together — a host with one and not the other silently renders empty
    # sections rather than failing.
    ~/.config/gh-dash/config.yml: gh-dash/config.yml

    # TUI, not GUI: these run identically over ssh and under WSL, so keying them
    # to the laptop was keying on the host rather than on what they need.
    # ccstatusline is the case that showed it — asdf/npm-globals.sh installs the
    # package on both hosts, so the WSL box ran it with default config.
    ~/.config/ranger: ranger
    ~/.config/htop: htop
    ~/.config/ccstatusline: ccstatusline

    # Neovim. Vendored from a friend's NvChad v2.5 config; nvim/README.md
    # records what was changed and why. Linked whole because lazy.nvim writes
    # nothing back into it — plugin state lives in ~/.local/share/nvim, so the
    # only file that changes here is lazy-lock.json, which is meant to be
    # committed.
    ~/.config/nvim: nvim

    # Notes
    ~/lessons: notes/lessons
    ~/PROJECT_PLAYBOOK.md: notes/PROJECT_PLAYBOOK.md

    # Toolchain
    ~/.tool-versions: asdf/tool-versions

    # Sync timer
    ~/.config/systemd/user/dotfiles-sync.service: systemd/dotfiles-sync.service
    ~/.config/systemd/user/dotfiles-sync.timer: systemd/dotfiles-sync.timer

# Before asdf, not after it. asdf downloads and compiles: its plugins need
# curl, unzip and a compiler, which packages/manifest.yaml is what declares. On
# a machine that already has them the order is invisible, which is exactly why
# it has to be reasoned about rather than observed — the laptop cannot show this
# step failing.
#
# The only step needing root, so it is opt-in: plain ./install prints what it
# skipped and still verifies. On a genuinely fresh host, ./install --packages is
# not optional, because nothing below it will succeed without these.
- shell:
    - command: ./packages/sync-packages.sh
      description: Install and verify this host's packages
      stdout: true
      stderr: true

    # After the packages, because zsh is one of them. Guarded rather than
    # trusted: it refuses unless zsh is installed, listed in /etc/shells, and
    # actually runs, and a refusal leaves the shell alone instead of failing the
    # install. Recovering from a login shell that will not start means a TTY.
    - command: ./shell/set-login-shell.sh
      description: Make zsh the login shell
      stdout: true
      stderr: true

- shell:
    - command: ./asdf/install-asdf.sh
      description: Install asdf

# Language runtimes and the editor. CLI tools are tier 0, in WiseOS'
# home/wise.nix — a flake lock pins them without compiling them here.
- asdf:
    - plugin: nodejs
      url: https://github.com/asdf-vm/asdf-nodejs
      versions:
        - 24.18.0
    # Owns Python on both hosts: the interpreter as well as the packaging. No
    # distro python3 is declared in packages/manifest.yaml, and none should be —
    # asdf/uv-python.sh puts uv's interpreter on PATH ahead of it, which is what
    # mason finds when it builds the venv for pyright, ruff, black and debugpy.
    - plugin: uv
      url: https://github.com/asdf-community/asdf-uv.git
      versions:
        - 0.12.3

    # Pinned behind current stable (v0.12.x) on purpose: nvim/lazy-lock.json is
    # the plugin set this config was actually running against, and that set was
    # locked on 0.11. The config needs at least 0.11 either way — it configures
    # LSP through vim.lsp.config/vim.lsp.enable, which does not exist before it.
    - plugin: neovim
      url: https://github.com/richin13/asdf-neovim.git
      versions:
        - v0.11.3

    - plugin: rust
      url: https://github.com/code-lever/asdf-rust.git
      versions:
        - 1.97.1

    # Registered as "golang", not "go" — ~/.tool-versions names golang while the
    # command stays go.
    - plugin: golang
      url: https://github.com/asdf-community/asdf-golang.git
      versions:
        - 1.26.5

# The asdf directive above reports success even when it installs nothing.
- shell:
    - command: ./asdf/verify-tools.sh
      description: Verify the toolchain actually installed
      stdout: true
      stderr: true
    - command: ./asdf/npm-globals.sh
      description: Install global npm packages
      stdout: true
      stderr: true

    - command: ./asdf/uv-python.sh
      description: Install Python with uv
      stdout: true
      stderr: true

    - command: ./asdf/gh-review-build.sh
      description: Build gh-review from pinned upstream plus our patch
      stdout: true
      stderr: true

    - command: ./asdf/gh-dash-build.sh
      description: Build gh-dash from pinned upstream plus our patch
      stdout: true
      stderr: true

    - command: ./systemd/enable-timer.sh
      description: Enable the sync timer
      stdout: true
      stderr: true
