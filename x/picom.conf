backend = "glx";
vsync = true;

# Shadow and fade are scoped to Rofi -- tiled windows keep their flat look.
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -18;
shadow-offset-y = -12;
shadow-exclude = [ "!(class_g = 'Rofi')" ];

fading = true;
fade-in-step = 0.10;
fade-out-step = 0.12;
fade-delta = 6;
fade-exclude = [ "!(class_g = 'Rofi')" ];
