# iwd owns wlan0 outright, including its IP: EnableNetworkConfiguration makes
# iwd do DHCP itself, so no second daemon needs to hold the radio. That is what
# lets system/network/20-wired.network match the wired link only.
#
# NameResolvingService=systemd hands DNS to systemd-resolved, which is why
# /etc/resolv.conf is the resolved stub rather than a file iwd writes.

[General]
EnableNetworkConfiguration=true

[Network]
NameResolvingService=systemd
